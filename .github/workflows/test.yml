name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Validate the example config parses
        run: DISCORD_WEBHOOK_URL=https://example.invalid python -c "from jobsearch.config import Config; Config.load('config.example.yaml')"
