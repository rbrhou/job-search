# Target: Summer 2027 internships in quantitative / actuarial / data roles,
# based in Canada (Toronto, Vancouver, Montreal preferred).

sources:
  # Boards verified live on 2026-09-13 (run #4). Slugs that 404'd have been
  # removed: wearehrt, drw, radixtrading, belvederetrading, citadel,
  # citadelsecurities, twosigma, aqrcapitalmanagement, millenniummanagement,
  # shopify, wealthsimple, 1password, clio, coveo, lightspeedcommerce, ssense,
  # and lever/ada, lever/hootsuite, lever/thinkific.
  - type: greenhouse
    boards:
      - janestreet          # 230 postings
      - point72             # 229
      - imc                 # 171
      - jumptrading         # 107
      - squarepointcapital  # 93
      - faire               # 67
      - oldmissioncapital   # 38
      - akunacapital        # 37
      - fiveringsllc        # 16
      - optiver             # 0 — board is live but currently empty

  - type: lever
    companies:
      - benchsci            # 0 — board is live but currently empty

  - type: ashby
    boards:
      - cohere              # 145 — Toronto-headquartered

  # --- Canadian banks, insurers and pension funds (Workday) -----------------
  # This is where Canadian actuarial, quant and data internships actually are.
  #
  # To add or correct an employer: open their careers page, run a search, and
  # copy the URL from the address bar. It looks like
  #   https://<tenant>.wd3.myworkdayjobs.com/en-US/<SiteName>
  # and that is exactly what goes in `url` — tenant, pod (wd1/wd3/wd5/...) and
  # site name are all read from it. Guessed entries that 404 are logged and
  # skipped, so a wrong URL costs nothing but that employer's coverage.
  - type: workday
    # These employers list thousands of roles, far past any page limit, so
    # narrow server-side. Several terms are needed: a Canadian internship is
    # variously an "intern", a "co-op" or a "student".
    search_texts: [intern, co-op, student, summer, actuarial]
    max_pages: 10
    # Verified live 2026-09-15 (run #9): BMO 154 postings, Sun Life 113,
    # CIBC 103 — between them six real matches including two actuarial co-ops.
    # The rest still need correct URLs. Their failure code says what is wrong:
    #   404 -> right pod, wrong site name; fix the last path segment.
    #   422 -> tenant is on another pod; try wd1/wd2/wd5/wd10/wd12.
    # Setting `pod_fallback: true` searches the pods automatically, but it is
    # slow (see README) — use it once, pin what it logs, then turn it off.
    employers:
      # Banks
      # 404 in run #9 — site name wrong
      - name: RBC
        url: https://rbc.wd3.myworkdayjobs.com/en-US/RBCJOBS
      - name: TD
        url: https://td.wd3.myworkdayjobs.com/en-US/TD_Bank_Group_External_Careers
      # verified: 154 postings
      - name: BMO
        url: https://bmo.wd3.myworkdayjobs.com/en-US/External
      - name: Scotiabank
        url: https://scotiabank.wd3.myworkdayjobs.com/en-US/Scotiabank_Careers
      # verified: 103 postings
      - name: CIBC
        url: https://cibc.wd3.myworkdayjobs.com/en-US/search
      - name: National Bank of Canada
        url: https://bnc.wd3.myworkdayjobs.com/en-US/Careers
      # Insurers — the home of actuarial internships
      # verified: 113 postings
      - name: Sun Life
        url: https://sunlife.wd3.myworkdayjobs.com/en-US/Experienced-Jobs
      - name: Manulife
        url: https://manulife.wd3.myworkdayjobs.com/en-US/MFCJobs
      - name: Canada Life
        url: https://canadalife.wd3.myworkdayjobs.com/en-US/canadalifecareers
      - name: Intact Financial
        url: https://intact.wd3.myworkdayjobs.com/en-US/IFC_Careers
      - name: Definity
        url: https://definity.wd3.myworkdayjobs.com/en-US/Definity
      # Pension funds
      - name: CPP Investments
        url: https://cppib.wd3.myworkdayjobs.com/en-US/CPPIB_Careers
      - name: Ontario Teachers' Pension Plan
        url: https://otpp.wd3.myworkdayjobs.com/en-US/OTPP
      - name: OMERS
        url: https://omers.wd3.myworkdayjobs.com/en-US/OMERS_Careers

# ---------------------------------------------------------------------------
# Two AND-ed groups: a posting must be BOTH a target role AND an internship.
# Keywords inside a group are OR-ed; keywords match as substrings.
# ---------------------------------------------------------------------------
match:
  title_include:
    # Group 1 — the role. "quant" covers quantitative researcher/analyst/trader,
    # "data analy" covers analyst/analytics/analysis, "data scien" covers
    # scientist/science.
    - [quant, actuarial, financial engineering, data analy, data scien, analytics]
    # Group 2 — the internship. "co-op" and "student" matter in Canada, and
    # "summer analyst" is the finance sector's word for an internship.
    - [intern, co-op, coop, summer analyst, student]

  title_exclude:
    # Seniority: an internship is none of these.
    - senior
    - staff
    - principal
    - director
    - manager
    - vice president
    - head of
    # Wrong recruiting cycle — you want Summer 2027.
    - summer 2026
    - winter 2026
    - fall 2026
    - spring 2026
    - summer 2025
    # "intern" would otherwise match "Internal Audit".
    - internal audit

  location_include:
    - canada
    - toronto
    - vancouver
    - montreal
    - montréal
    - ontario
    - british columbia
    - quebec
    - québec
    - waterloo
    - ottawa
    - calgary

  location_exclude: []
  company_exclude: []
  description_exclude: []
  remote_only: false
  # A remote US internship is not workable on a Canadian search.
  remote_satisfies_location: false

  # Summer 2027 recruiting opens early — some quant firms post in July/August.
  # 90 days reaches back across the whole early cycle.
  max_age_days: 90

notifiers:
  - type: discord
    webhook_url: ${DISCORD_WEBHOOK_URL}
    username: Job Search
  - type: console

state_path: state/seen.json
max_per_run: 100
notify_on_first_run: false
request_timeout: 20
