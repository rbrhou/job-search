[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearch"
version = "0.1.0"
description = "Collect job postings from job boards and notify a Discord channel about new matches."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
jobsearch = "jobsearch.cli:main"

[tool.setuptools.packages.find]
include = ["jobsearch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
